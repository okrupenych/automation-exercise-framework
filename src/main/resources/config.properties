# Application
base.url = https://www.automationexercise.com

# Browser
browser.headless = false
browser.timeout = 15000
# Finite recovery budget when browser.timeout is disabled (ms)
browser.recovery.timeout = 15000
# Transient message capture and diagnostic product-name lookup (ms)
browser.transient.text.timeout = 5000
browser.log.name.timeout = 500

# API
api.base.url=https://automationexercise.com/api/
api.timeout=30000
# Log archive limits (positive values)
logs.archive.retention.days = 30
logs.archive.max.size.mb = 500

# Cross-engine launch and context settings
browser.type = chromium
browser.launch.timeout = 180000
browser.navigation.timeout = 15000
browser.assertion.timeout = 5000
browser.slow.mo = 0
browser.viewport.width = 1920
browser.viewport.height = 1080
browser.locale = en-US
browser.timezone = UTC
browser.color.scheme = light
log.level = INFO
logs.directory = logs
